plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation files('libs/jpl.jar')
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'org.example.MainClass'
    applicationDefaultJvmArgs = ["-Djava.library.path=C:/Program Files/swipl/bin"]
}
